[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sse-toolcall-audit"
version = "0.1.0"
description = "Offline SSE capture auditor for Chat Completions and Responses tool-call assembly, completion and semantic comparison."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Afloat16"}]
dependencies = []

[project.urls]
Repository = "https://github.com/Afloat16/sse-toolcall-audit"
Issues = "https://github.com/Afloat16/sse-toolcall-audit/issues"

[project.optional-dependencies]
dev = ["build>=1.2"]

[project.scripts]
sse-toolcall-audit = "sse_toolcall_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
